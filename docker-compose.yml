version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sporthub_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespw}
      POSTGRES_DB: ${POSTGRES_DB:-sporthub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sporthub_net
    restart: always

  redis:
    image: redis:alpine
    container_name: sporthub_redis
    ports:
      - "6379:6379"
    networks:
      - sporthub_net
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sporthub_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespw}@postgres:5432/${POSTGRES_DB:-sporthub}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    ports:
      - "8090:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - sporthub_net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: sporthub_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "8091:3001"
    depends_on:
      - backend
    networks:
      - sporthub_net
    restart: always

networks:
  sporthub_net:
    driver: bridge

volumes:
  postgres_data:
