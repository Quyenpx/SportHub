version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sporthub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: sporthub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sporthub_net
    restart: always

  # Redis service for caching and socket.io adapter (optional for now but good for extension)
  redis:
    image: redis:alpine
    container_name: sporthub_redis
    ports:
      - "6379:6379"
    networks:
      - sporthub_net
    restart: always

networks:
  sporthub_net:
    driver: bridge

volumes:
  postgres_data:
